<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arteo Excentric — 2024–2027</title>
  <meta name="description" content="Arteo Excentric Class Website (2024 - 2027) — A magical place where all different kind of human gather.">
  
  <!-- Google Fonts for Classical Roman & Elegant Serif Lettering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./kode/style.css">
</head>
<body class="site-body">

  <!-- Background Vintage Texture & Noise Layer -->
  <div class="vintage-bg"></div>
  <div class="vintage-vignette"></div>
  <div class="grain"></div>
  
  <!-- Magical Floating Sparkles Canvas -->
  <canvas id="magic-canvas"></canvas>

  <div class="page-wrapper">
    
    <!-- ================= SECTION 1: HEADER / TULISAN ARTEO EXCENTRIC ================= -->
    <header class="section-hero" id="hero">
      <div class="hero-inner">
        <div class="hero-year-wrapper">
          <span class="hero-year">2024 — 2027</span>
        </div>
        
        <h1 class="hero-title">ARTEO EXCENTRIC</h1>
        
        <div class="hero-subtitle-wrapper">
          <p class="hero-subtitle">A MAGICAL PLACE WHERE ALL DIFFERENT KIND OF HUMAN GATHER</p>
        </div>
      </div>
    </header>

    <!-- ================= SECTION 2: CARD & KOMPONEN TAMAN ================= -->
    <section class="section-showcase" id="showcase">
      
      <!-- Interactive Cards (Side by Side) -->
      <div class="cards-container">
        
        <!-- Card 1: Structure (Menuju ke Daftar Member & Struktur) -->
        <a href="./kode/member.html" class="art-card" id="card-structure" aria-label="Lihat Struktur Kelas Arteo">
          <div class="card-perspective">
            <div class="card-frame">
              <img src="./cover/structure.jpg" alt="Arteo Structure" class="card-cover-img" loading="eager">
              <div class="card-overlay-sheen"></div>
              <div class="card-gold-border"></div>
            </div>
          </div>
          <span class="card-hint">STRUKTUR</span>
        </a>

        <!-- Card 2: History (Menuju ke Filosofi & Sejarah) -->
        <a href="./kode/logo.html" class="art-card" id="card-history" aria-label="Lihat Sejarah dan Filosofi Arteo">
          <div class="card-perspective">
            <div class="card-frame">
              <img src="./cover/history.jpg" alt="Arteo History" class="card-cover-img" loading="eager">
              <div class="card-overlay-sheen"></div>
              <div class="card-gold-border"></div>
            </div>
          </div>
          <span class="card-hint">SEJARAH</span>
        </a>

      </div>

      <!-- Komponen Taman (Landscape Arteo Gallery) -->
      <div class="garden-wrapper">
        <div class="garden-scene">
          <img src="./argal/taman.png" alt="Arteo Gallery Garden Component" class="garden-graphic" loading="eager">
          
          <!-- Ambient Glow under the Arteo Gallery Neon text -->
          <div class="gallery-glow-pulse"></div>
          
          <!-- Floating Magical Fairies / Fireflies -->
          <div class="firefly ff-1"></div>
          <div class="firefly ff-2"></div>
          <div class="firefly ff-3"></div>
          <div class="firefly ff-4"></div>
          <div class="firefly ff-5"></div>
          <div class="firefly ff-6"></div>
        </div>
      </div>

    </section>

  </div>

  <script src="./kode/script.js"></script>
</body>
</html>
